[package]
name = "miden-amm"
version = "0.1.0"
edition = "2024"

[dependencies]
miden-client = { version = "0.15", features = ["testing", "tonic"] }
miden-client-sqlite-store = "0.15"
# 0.15.0-0.15.2 of the protocol-line crates are yanked on crates.io; pin 0.15.3+
miden-protocol = { version = "0.15.3", features = ["testing"] }
miden-standards = { version = "0.15.3", features = ["testing"] }
miden-testing = "0.15.3"
rand = { version = "0.9" }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "macros", "fs"] }
anyhow = "1.0"
